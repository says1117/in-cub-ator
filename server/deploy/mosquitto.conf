# server/deploy/mosquitto.conf: Mosquitto broker configuration on the Jetson. Owner: Role 2 (server).
# Installed to /etc/mosquitto/conf.d/incube.conf by setup_jetson.sh.
# Open to the local network with no password: fine on a private hackathon Wi-Fi.
# For a shared network: run `mosquitto_passwd -c server/deploy/passwd incube`, point password_file at it,
# set allow_anonymous false, and give the ESP32 (secrets.h) and the server (INCUBE_MQTT_USER/PASSWORD) the login.
listener 1883
allow_anonymous true
persistence false
